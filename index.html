<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>@fraiswahab</title>
<style>
:root{--bg:#2bb383;--bg2:#0fd9a0;--btn:#00a86f;--txt:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#127a58;--bg2:#0a9f78;--btn:#067a52}}
:root[data-theme="dark"]{--bg:#127a58;--bg2:#0a9f78;--btn:#067a52}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--txt);overflow-x:hidden}
.card{max-width:440px;margin:0 auto;position:relative;min-height:100vh;background:var(--bg)}
.hero{position:sticky;top:0;height:100vh;overflow:hidden;will-change:transform,opacity;background:linear-gradient(180deg,#f2fffa,#9ff0d2 60%,var(--bg2))}
.hero svg{position:absolute;left:50%;bottom:30vh;transform:translateX(-50%);width:80%;max-width:340px;opacity:.85}
.hero .pic{position:absolute;left:0;top:0;width:100%;height:auto;aspect-ratio:1/1;object-fit:cover;-webkit-mask-image:linear-gradient(180deg,#000 70%,transparent);mask-image:linear-gradient(180deg,#000 70%,transparent)}
.hero .fade{position:absolute;inset:auto 0 0 0;height:45%;background:linear-gradient(180deg,transparent,var(--bg2))}
.content{position:relative;z-index:2;margin-top:-45vh;min-height:100vh;padding:0 20px 80px;background:linear-gradient(180deg,transparent 0,var(--bg2) 90px,var(--bg2))}
.rv{opacity:0;transform:translateY(36px) scale(.97);transition:opacity 1s cubic-bezier(.22,1,.36,1),transform 1s cubic-bezier(.22,1,.36,1);will-change:transform,opacity}
.rv.in{opacity:1;transform:none}
h1{text-align:center;font-size:2rem;padding-top:48px;line-height:1.1}
.tag{text-align:center;font-size:.9rem;margin:8px 0 14px;font-weight:500}
.icons{display:flex;justify-content:center;gap:20px;margin-bottom:22px}
.icons a{color:#fff;display:flex}.icons svg{width:30px;height:30px;fill:currentColor}.icons svg.s{fill:none;stroke:currentColor;stroke-width:1.8}
.links{display:flex;flex-direction:column;gap:12px;margin-top:0}
.links a{display:block;text-align:center;padding:19px;border-radius:999px;background:var(--btn);color:#fff;text-decoration:none;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.12);transition:transform .2s}
.links a:hover{transform:scale(1.03)}
.foot{text-align:center;font-size:.7rem;margin-top:36px;opacity:.9}
</style>
</head>

<script>
const hero=document.getElementById('hero');
let cur=0,tgt=0;
function loop(){
  tgt=Math.min(window.scrollY/(innerHeight*0.8),1);
  cur+=(tgt-cur)*0.12;
  const e=cur*cur*(3-2*cur);
  hero.style.transform='translate3d(0,'+(-e*50)+'px,0) scale('+(1+e*0.1)+')';
  hero.style.opacity=1-e*0.8;
  requestAnimationFrame(loop);
}
loop();
const io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){
  const sib=[...e.target.parentElement.children].indexOf(e.target);
  e.target.style.transitionDelay=(sib*70)+'ms';
  e.target.classList.add('in');io.unobserve(e.target);}})},{threshold:.1,rootMargin:'0px 0px -6% 0px'});
document.querySelectorAll('.rv').forEach(el=>io.observe(el));
</script>
